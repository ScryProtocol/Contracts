server {
    server_name pogchamp.tv 159.223.150.70;
    root /var/www/pogchamp;
    index index.html;

    location = /meow {
        proxy_pass http://127.0.0.1:4090/meow;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /meow/ {
        proxy_pass http://127.0.0.1:4090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /music {
        proxy_pass http://127.0.0.1:4095/music;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /music/ {
        proxy_pass http://127.0.0.1:4095;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v1/music/ {
        proxy_pass http://127.0.0.1:4095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /agent/ {
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /pay {
        proxy_pass http://127.0.0.1:4090/pay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /handle/ {
        proxy_pass http://127.0.0.1:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # One-port hub routing
    location = /hub/eth { return 301 /hub/eth/; }
    location = /hub/eth/ { return 302 /hub/eth/.well-known/x402; }
    location = /hub/base { return 301 /hub/base/; }
    location = /hub/base/ { return 302 /hub/base/.well-known/x402; }
    location = /hub/sepolia { return 301 /hub/sepolia/; }
    location = /hub/sepolia/ { return 302 /hub/sepolia/.well-known/x402; }

    location ^~ /hub/eth/ {
        rewrite ^/hub/eth/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4022;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /hub/base/ {
        rewrite ^/hub/base/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4023;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /hub/sepolia/ {
        rewrite ^/hub/sepolia/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /scppay {
        alias /var/www/pogchamp/scppay;
        index index.html;
        try_files $uri $uri/ /scppay/index.html;
    }

    location = /scp {
        alias /var/www/pogchamp/scp-landing.html;
    }

    location ^~ /scppay {
        alias /var/www/pogchamp/scppay;
        index index.html;
        try_files $uri $uri/ /scppay/index.html;
    }

    location = /scp {
        alias /var/www/pogchamp/scp-landing.html;
    }

    location /scp/ {
        alias /var/www/pogchamp/scp/;
        index index.html;
    }

    location /scpapp {
        alias /var/www/pogchamp/scpapp;
        index index.html;
        try_files $uri $uri/ /scpapp/index.html;
    }

    location /meowmeow {
        alias /root/chatapp/build;
        index index.html;
        try_files $uri $uri/ /meowmeow/index.html;
    }

    location /static/ {
        alias /root/chatapp/build/static/;
    }

    location /meowmeow_old {
        alias /root/chatapp/build;
        index index.html;
        try_files $uri $uri/ /meowmeow/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pogchamp.tv/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pogchamp.tv/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

